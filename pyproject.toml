[project]
name = "mclab"
version = "0.1.0"
description = "Reproducible Minecraft AI test laboratory"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mclab = "mclab.cli:main"
mcplay = "mclab.play_cli:main"
mcarena = "mclab.play_cli:arena_main"
mcb-mcp = "mclab.mcb_mcp:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Throwaway analysis scripts: long printf-style lines and late imports are fine.
"scripts/analysis/*" = ["E501", "E402"]
# Arena validator messages and block-name lists read better unwrapped.
"src/mclab/arena/*" = ["E501"]
"tests/test_arena_*" = ["E501"]
