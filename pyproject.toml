[project]
name = "mclab"
version = "0.1.0"
description = "Reproducible Minecraft AI test laboratory"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mclab = "mclab.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
