import groovy.json.JsonSlurper

buildscript {
    def pins = new groovy.json.JsonSlurper().parse(file('../config/dependencies.lock.json'))
    repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
    dependencies { classpath "net.fabricmc:fabric-loom:${pins.loom}" }
    configurations.classpath { resolutionStrategy.activateDependencyLocking() }
}
apply plugin: 'net.fabricmc.fabric-loom'

def pins = new JsonSlurper().parse(file('../config/dependencies.lock.json'))
version = '0.1.0'
group = 'com.vulpine.mclab'

dependencies {
    minecraft "com.mojang:minecraft:${pins.minecraft}"
    implementation "net.fabricmc:fabric-loader:${pins.loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${pins.fabric_api}"
    compileOnly files('../runtime/downloads/' + pins.artifacts.carpet.name)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('jar') {
    // Keep installation provenance current even when a source edit changes no bytecode.
    inputs.dir('src')
    inputs.file('build.gradle')
    inputs.file('../config/dependencies.lock.json')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

sourceSets {
    geometryVerification {
        java.srcDir('src/verification/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('verifyReferenceGeometry', JavaExec) {
    dependsOn tasks.named('geometryVerificationClasses')
    classpath = sourceSets.geometryVerification.runtimeClasspath
    mainClass = 'com.vulpine.mclab.ReferenceGeometryTest'
}
tasks.named('check') { dependsOn tasks.named('verifyReferenceGeometry') }
